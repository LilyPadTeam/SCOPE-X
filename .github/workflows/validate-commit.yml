name: Validate SCOPE-X Commits

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  validate:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get all commit messages
        id: commits
        run: |
          # For pull requests, get commits in the PR
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Get the base ref (target branch) and compare
            git fetch origin ${{ github.base_ref }}
            COMMITS=$(git log --format=%s origin/${{ github.base_ref }}..HEAD 2>/dev/null || echo "")
          else
            # For pushes, get commits since last push or all commits if shallow
            # Use a safer approach: get all commits in this push
            if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              # Get commits since the previous commit
              COMMITS=$(git log --format=%s ${{ github.event.before }}..HEAD 2>/dev/null || echo "")
            else
              # Fallback: get last 10 commits, but handle if less exist
              COMMITS=$(git log --format=%s -n 10 HEAD 2>/dev/null || echo "")
            fi
          fi
          
          # If no commits found, exit gracefully
          if [ -z "$COMMITS" ]; then
            echo "No commits to validate"
            echo "commits=No commits to validate" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Validate SCOPE-X format
        if: steps.commits.outputs.commits != 'No commits to validate'
        run: |
          VALID=true
          COMMIT_LIST="${{ steps.commits.outputs.commits }}"
          
          # Handle case where commits might have newlines
          echo "$COMMIT_LIST" | while IFS= read -r commit; do
            # Skip empty lines
            if [ -z "$commit" ]; then
              continue
            fi
            
            echo "Checking: $commit"
            
            # Check if commit matches SCOPE-X format
            # Format: type(!)(scope1 & scope2): subject OR type(!)(scope1, scope2): subject
            if [[ ! $commit =~ ^[a-z]+(!?)\\(([a-z0-9]+([\&,][a-z0-9]+){0,2})\\):\ .+$ ]]; then
              echo "ERROR: Invalid commit message: $commit"
              echo ""
              echo "Expected format:"
              echo "  Single file: <type>(<scope1> & <scope2>): <subject>"
              echo "  Multiple files: <type>(<scope1>, <scope2>): <subject>"
              echo "  Breaking: <type>!(<scope>): <subject>"
              echo "  Max 3 scopes allowed"
              echo ""
              echo "Examples:"
              echo "  feat(auth & monitoring): add structured logging"
              echo "  fix(auth, api): handle expired token"
              echo "  feat!(core, ui): migrate to new state management"
              exit 1
            fi
            
            echo "✅ Valid commit: $commit"
          done
          
          # Check if validation passed
          if [ "$?" -eq 0 ]; then
            echo "✅ All commit messages are valid SCOPE-X format!"
          else
            exit 1
          fi
