name: Validate SCOPE-X Commits

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  validate:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get commit messages
        id: commits
        run: |
          # For pull requests, get commits in the PR
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            COMMITS=$(git log --format=%s origin/${{ github.base_ref }}..HEAD 2>/dev/null || echo "")
          else
            # For pushes, get commits since last push
            if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              COMMITS=$(git log --format=%s ${{ github.event.before }}..HEAD 2>/dev/null || echo "")
            else
              COMMITS=$(git log --format=%s -n 10 HEAD 2>/dev/null || echo "")
            fi
          fi
          
          if [ -z "$COMMITS" ]; then
            echo "No commits to validate"
            echo "commits=No commits to validate" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Store commits in a file to handle multiline properly
          echo "$COMMITS" > commits.txt
          echo "commits_file=commits.txt" >> $GITHUB_OUTPUT
          
      - name: Validate SCOPE-X format
        if: steps.commits.outputs.commits_file != ''
        run: |
          COMMITS_FILE="${{ steps.commits.outputs.commits_file }}"
          VALID=0
          LINE_NUM=0
          
          while IFS= read -r commit; do
            LINE_NUM=$((LINE_NUM + 1))
            
            # Skip empty lines
            if [ -z "$commit" ]; then
              continue
            fi
            
            echo "Checking: $commit"
            
            # Check if commit has the required format (contains '(' and ')')
            if [[ ! "$commit" =~ .*\(.*\).* ]]; then
              echo "❌ ERROR: Missing format 'type(scope): subject'"
              echo "   Commit: $commit"
              VALID=1
              continue
            fi
            
            # Extract parts
            TYPE=$(echo "$commit" | cut -d'(' -f1)
            REST=$(echo "$commit" | cut -d'(' -f2-)
            
            # Check for breaking change indicator BEFORE modifying TYPE
            BREAKING="No"
            if [[ "$TYPE" == *"!"* ]]; then
              BREAKING="Yes"
              TYPE=$(echo "$TYPE" | sed 's/!$//')
            fi
            
            # Extract scope and subject
            SCOPES=$(echo "$REST" | cut -d')' -f1)
            SUBJECT=$(echo "$REST" | cut -d')' -f2- | sed 's/^://' | sed 's/^[[:space:]]*//')
            
            # Validate parts exist
            if [ -z "$TYPE" ]; then
              echo "❌ ERROR: Missing type"
              echo "   Commit: $commit"
              VALID=1
              continue
            fi
            
            if [ -z "$SCOPES" ]; then
              echo "❌ ERROR: Missing scope(s)"
              echo "   Commit: $commit"
              VALID=1
              continue
            fi
            
            if [ -z "$SUBJECT" ]; then
              echo "❌ ERROR: Missing subject"
              echo "   Commit: $commit"
              VALID=1
              continue
            fi
            
            # Clean up scopes (remove spaces)
            SCOPES_CLEAN=$(echo "$SCOPES" | tr -d ' ')
            
            # Count scopes - handle both & and , but not mixed
            if [[ "$SCOPES_CLEAN" == *"&"* ]] && [[ "$SCOPES_CLEAN" == *","* ]]; then
              echo "❌ ERROR: Cannot mix '&' and ',' delimiters in scopes"
              echo "   Scopes: $SCOPES"
              VALID=1
              continue
            fi
            
            if [[ "$SCOPES_CLEAN" == *"&"* ]]; then
              COUNT=$(echo "$SCOPES_CLEAN" | tr '&' '\n' | wc -l | tr -d ' ')
            elif [[ "$SCOPES_CLEAN" == *","* ]]; then
              COUNT=$(echo "$SCOPES_CLEAN" | tr ',' '\n' | wc -l | tr -d ' ')
            else
              COUNT=1
            fi
            
            # Validate max 3 scopes
            if [ "$COUNT" -gt 3 ]; then
              echo "❌ ERROR: Too many scopes ($COUNT). Maximum is 3."
              echo "   Commit: $commit"
              VALID=1
              continue
            fi
            
            # Validate type is alphanumeric (lowercase only)
            if [[ ! "$TYPE" =~ ^[a-z]+$ ]]; then
              echo "❌ ERROR: Type must be lowercase letters only: $TYPE"
              echo "   Commit: $commit"
              VALID=1
              continue
            fi
            
            # Validate scope characters (only lowercase, numbers, &, ,)
            if [[ ! "$SCOPES_CLEAN" =~ ^[a-z0-9]+([&,][a-z0-9]+)*$ ]]; then
              echo "❌ ERROR: Scopes must contain only lowercase letters, numbers, &, and ,"
              echo "   Scopes: $SCOPES"
              echo "   Commit: $commit"
              VALID=1
              continue
            fi
            
            # Validate subject (should not be empty and should have at least one word)
            if [[ "$SUBJECT" =~ ^[[:space:]]*$ ]]; then
              echo "❌ ERROR: Subject cannot be empty"
              echo "   Commit: $commit"
              VALID=1
              continue
            fi
            
            # All validations passed
            echo "✅ Valid commit: $commit"
            echo "   Type: $TYPE"
            echo "   Breaking: $BREAKING"
            echo "   Scopes: $SCOPES ($COUNT scope(s))"
            echo "   Subject: $SUBJECT"
            echo "---"
            
          done < "$COMMITS_FILE"
          
          if [ "$VALID" -eq 0 ]; then
            echo "✅ All commit messages are valid SCOPE-X format!"
          else
            echo "❌ One or more commits failed validation"
            exit 1
          fi
