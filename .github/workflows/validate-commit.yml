name: Validate SCOPE-X Commits

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  validate:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get commit messages
        id: commits
        run: |
          # For pull requests, get commits in the PR
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            COMMITS=$(git log --format=%s origin/${{ github.base_ref }}..HEAD 2>/dev/null || echo "")
          else
            # For pushes, get commits since last push
            if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              COMMITS=$(git log --format=%s ${{ github.event.before }}..HEAD 2>/dev/null || echo "")
            else
              COMMITS=$(git log --format=%s -n 10 HEAD 2>/dev/null || echo "")
            fi
          fi
          
          if [ -z "$COMMITS" ]; then
            echo "No commits to validate"
            echo "commits=No commits to validate" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Validate SCOPE-X format
        if: steps.commits.outputs.commits != 'No commits to validate'
        run: |
          VALID=true
          COMMIT_LIST="${{ steps.commits.outputs.commits }}"
          
          echo "$COMMIT_LIST" | while IFS= read -r commit; do
            if [ -z "$commit" ]; then
              continue
            fi
            
            echo "Checking: $commit"
            
            # Validate with a simpler approach using multiple conditions
            # Extract type, scope, and subject
            if [[ "$commit" =~ ^([a-z]+)(!?)\(([^)]+)\):(.+)$ ]]; then
              TYPE="${BASH_REMATCH[1]}"
              BREAKING="${BASH_REMATCH[2]}"
              SCOPES="${BASH_REMATCH[3]}"
              SUBJECT="${BASH_REMATCH[4]}"
              
              # Clean up scopes (remove spaces)
              SCOPES_CLEAN=$(echo "$SCOPES" | tr -d ' ')
              
              # Check if scopes are empty
              if [ -z "$SCOPES_CLEAN" ]; then
                echo "ERROR: Empty scope"
                exit 1
              fi
              
              # Check subject
              if [ -z "$SUBJECT" ] || [[ "$SUBJECT" =~ ^[[:space:]]+$ ]]; then
                echo "ERROR: Empty subject"
                exit 1
              fi
              
              # Count scopes
              if [[ "$SCOPES_CLEAN" == *"&"* ]]; then
                DELIMITER="&"
                COUNT=$(echo "$SCOPES_CLEAN" | awk -F'&' '{print NF}')
              elif [[ "$SCOPES_CLEAN" == *","* ]]; then
                DELIMITER=","
                COUNT=$(echo "$SCOPES_CLEAN" | awk -F',' '{print NF}')
              else
                DELIMITER="none"
                COUNT=1
              fi
              
              # Validate max 3 scopes
              if [ "$COUNT" -gt 3 ]; then
                echo "ERROR: Too many scopes ($COUNT). Maximum is 3."
                echo "Commit: $commit"
                exit 1
              fi
              
              echo "✅ Valid commit: $commit"
              echo "   Type: $TYPE"
              echo "   Breaking: ${BREAKING:-No}"
              echo "   Scopes: $SCOPES ($COUNT scope(s))"
              echo "   Subject: $SUBJECT"
              echo "---"
              
            else
              echo "ERROR: Invalid commit message format: $commit"
              echo ""
              echo "Expected format:"
              echo "  <type>(<scope1> & <scope2>): <subject>  (same file)"
              echo "  <type>(<scope1>, <scope2>): <subject>  (different files)"
              echo "  <type>!(<scope>): <subject>  (breaking change)"
              echo ""
              echo "Examples:"
              echo "  feat(auth & monitoring): add structured logging"
              echo "  fix(auth, api): handle expired token gracefully"
              echo "  feat!(core, ui): migrate to new state management"
              echo "  chore(fix & ci): fix errors"
              echo ""
              echo "Your commit: $commit"
              exit 1
            fi
          done
          
          if [ "$?" -eq 0 ]; then
            echo "✅ All commit messages are valid SCOPE-X format!"
          else
            exit 1
          fi
